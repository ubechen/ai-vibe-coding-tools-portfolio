<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Sparkle Primary Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle with Glowing Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Ambient Center Glow Orb -->
  <circle cx="32" cy="32" r="14" fill="#6366f1" opacity="0.25" filter="url(#glow)"/>

  <!-- Central AI Vibe 4-Point Star / Diamond Sparkle -->
  <path d="M32 12 C32 23 23 32 12 32 C23 32 32 41 32 52 C32 41 41 32 52 32 C41 32 32 23 32 12 Z" 
        fill="url(#sparkGrad)" filter="url(#glow)"/>

  <!-- Small Satellite Sparkle -->
  <path d="M46 16 C46 20 42 22 39 22 C42 22 46 24 46 28 C46 24 50 22 53 22 C50 22 46 20 46 16 Z" 
        fill="#38bdf8" opacity="0.9"/>

  <!-- Code Bracket Hint on Left & Right -->
  <path d="M19 26 L14 32 L19 38" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <path d="M45 26 L50 32 L45 38" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Inner Sparkle Core -->
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
</svg>
