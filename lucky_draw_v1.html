<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運大抽獎 - Lucky Draw System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fbf7ee',
                            100: '#f5edd6',
                            400: '#e0a938',
                            500: '#d9941a',
                            600: '#b87213',
                            900: '#43230a',
                        },
                        gold: {
                            300: '#fde047',
                            400: '#facc15',
                            500: '#eab308',
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-short': 'bounceShort 0.5s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: 1, boxShadow: '0 0 25px rgba(234, 179, 8, 0.4)' },
                            '50%': { opacity: 0.8, boxShadow: '0 0 50px rgba(234, 179, 8, 0.8)' },
                        },
                        bounceShort: {
                            '0%': { transform: 'translateY(0)' },
                            '100%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top center, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            min-height: 100vh;
            color: #f8fafc;
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #fffbeb 0%, #fde047 50%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-border {
            border: 2px solid #eab308;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.3);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Slot Machine Roller Effect */
        .slot-container {
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(234, 179, 8, 0.3);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(234, 179, 8, 0.6);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-100 antialiased selection:bg-amber-500 selection:text-black">

    <!-- Navbar Top Bar -->
    <header class="glass-panel sticky top-0 z-40 border-b border-amber-500/20 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-yellow-400 flex items-center justify-center shadow-lg shadow-amber-500/30">
                    <i class="fa-solid fa-trophy text-slate-950 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wide gold-gradient-text">幸運大抽獎 Lucky Draw</h1>
                    <p class="text-xs text-slate-400 flex items-center gap-1.5" id="data-status-bar">
                        <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>

                </div>
            </div>

            <!-- Toolbar Actions -->
            <div class="flex items-center gap-2">
                <button id="btn-sound" onclick="toggleSound()" class="p-2.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-amber-400 border border-slate-700 transition" title="聲音切換">
                    <i id="sound-icon" class="fa-solid fa-volume-high text-lg w-5 h-5 flex items-center justify-center"></i>
                </button>
                <button id="btn-fullscreen" onclick="toggleFullscreen()" class="p-2.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-amber-400 border border-slate-700 transition" title="全螢幕模式">

                </button>

            </div>

            <!-- Stage Display Container -->

                                <i class="fa-solid fa-caret-right text-amber-400 text-xl"></i>
                                <i class="fa-solid fa-caret-left text-amber-400 text-xl"></i>

                    <button id="tab-btn-candidates" onclick="switchSideTab('candidates')" class="flex-1 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition flex items-center justify-center gap-1.5">

                    <div class="relative mb-3">

    <!-- Winner Celebration Modal Popup -->
    <div id="winner-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="glass-panel rounded-3xl p-8 max-w-md w-full border-2 border-amber-400/80 text-center relative flex flex-col items-center shadow-2xl transform scale-90 transition-transform duration-300" id="modal-box">
            
            <div class="w-20 h-20 rounded-full bg-amber-500/20 border-2 border-amber-400 flex items-center justify-center text-amber-400 text-4xl mb-4 animate-bounce-short">
                <i class="fa-solid fa-crown"></i>
            </div>

            <p class="text-xs uppercase tracking-widest text-amber-400 font-semibold mb-1" id="modal-prize-name">🎉 幸運大獎</p>
            <h3 class="text-2xl font-black text-slate-100 mb-4">恭喜中獎幸運兒！</h3>

            <div id="modal-winner-cards" class="w-full space-y-3 my-2 max-h-60 overflow-y-auto custom-scrollbar px-2">
                <!-- Winner Items inserted here -->
            </div>

            <button onclick="closeWinnerModal()" class="mt-6 w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-bold text-base shadow-lg shadow-amber-500/30 hover:scale-105 active:scale-95 transition">
                收下這份幸運 (關閉)
            </button>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // Global State Variables
        let rawCsvData = [];
        let participants = []; // { id, name, sub, originalRow, isEligible: true }
        let winners = []; // { timestamp, prize, name, sub, id }
        let nameColumnKey = '';
        let subColumnKey = '';
        let isDrawing = false;
        let isSoundEnabled = true;
        let activeDrawMode = 'slot'; // 'slot' or 'wheel'

        // Web Audio API Synthesizer Context for Sound Effects
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playTickSound() {
            if (!isSoundEnabled) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440 + Math.random() * 100, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            } catch(e) {}
        }

        function playFanfareSound() {
            if (!isSoundEnabled) return;
            try {
                const ctx = getAudioContext();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.1);
                    osc.stop(ctx.currentTime + i * 0.1 + 0.4);
                });
            } catch(e) {}
        }

        // Initialize on Window Load
        window.onload = function() {
            reloadCsvData();
        };

        function reloadCsvData() {
            const urlInput = document.getElementById('csv-url-input').value.trim();
            const statusBar = document.getElementById('data-status-bar');
            const reloadIcon = document.getElementById('reload-icon');

            if (!urlInput) {
                showToast('請輸入有效的 CSV 網址', 'error');
                return;
            }

            reloadIcon.classList.add('fa-spin');
            statusBar.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span> 正在連線至 Google 試算表...`;

            Papa.parse(urlInput, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    reloadIcon.classList.remove('fa-spin');
                    if (results.data && results.data.length > 0) {
                        rawCsvData = results.data;
                        setupColumnSelectors(results.meta.fields || Object.keys(rawCsvData[0]));
                        processParticipantData();
                        statusBar.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> 已成功同步 ${rawCsvData.length} 筆資料`;
                        showToast(`已成功載入 ${rawCsvData.length} 筆資料`, 'success');
                    } else {
                        statusBar.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span> 讀取失敗或試算表無資料`;
                        showToast('讀取失敗，請確認試算表已發佈至網路為 CSV', 'error');
                    }
                },
                error: function(err) {
                    reloadIcon.classList.remove('fa-spin');
                    statusBar.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span> 讀取失敗: ${err.message}`;
                    showToast('無法抓取 CSV 資料，請檢查連結與網路', 'error');
                }
            });
        }

        function setupColumnSelectors(fields) {
            const nameSelect = document.getElementById('col-select-name');
            const subSelect = document.getElementById('col-select-sub');

            nameSelect.innerHTML = '';
            subSelect.innerHTML = '<option value="">(不顯示副資訊)</option>';

            fields.forEach((field, index) => {
                const opt1 = document.createElement('option');
                opt1.value = field;
                opt1.textContent = field;
                nameSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = field;
                opt2.textContent = field;
                subSelect.appendChild(opt2);
            });

            // Auto pick sensible default columns (e.g. 'Name', '姓名', 'Name/ID', or second column)
            const lowerFields = fields.map(f => f.toLowerCase());
            let nameIdx = lowerFields.findIndex(f => f.includes('名') || f.includes('name') || f.includes('title'));
            if (nameIdx === -1) nameIdx = 0;

            let subIdx = lowerFields.findIndex((f, idx) => idx !== nameIdx && (f.includes('部') || f.includes('編') || f.includes('id') || f.includes('dept') || f.includes('mail')));

            nameSelect.selectedIndex = nameIdx;
            if (subIdx !== -1) subSelect.selectedIndex = subIdx + 1; // +1 due to optional blank first option

            nameColumnKey = fields[nameIdx];
            subColumnKey = subIdx !== -1 ? fields[subIdx] : '';
        }

        function updateColumnMapping() {
            nameColumnKey = document.getElementById('col-select-name').value;
            subColumnKey = document.getElementById('col-select-sub').value;
            processParticipantData();
        }

        function processParticipantData() {
            if (!rawCsvData.length) return;

            participants = rawCsvData.map((row, index) => {
                const mainVal = row[nameColumnKey] ? String(row[nameColumnKey]).trim() : `成員 #${index + 1}`;
                const subVal = subColumnKey && row[subColumnKey] ? String(row[subColumnKey]).trim() : '';
                return {
                    id: index + 1,
                    name: mainVal,
                    sub: subVal,
                    originalRow: row,
                    isEligible: true
                };
            });

            updateStats();
            renderCandidatesList();
            renderWheelCanvas();
            renderSlotIdleState();
        }

        function updateStats() {
            const total = participants.length;
            const eligible = participants.filter(p => p.isEligible).length;
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-eligible').textContent = eligible;
        }

        function renderSlotIdleState() {
            const reel = document.getElementById('slot-reel');
            reel.style.transform = 'translateY(0px)';
            reel.innerHTML = `
                <div class="h-20 flex flex-col items-center justify-center text-center px-4">
                    <span class="text-3xl md:text-4xl font-extrabold gold-gradient-text tracking-wider">準備抽籤</span>
                    <span class="text-xs text-slate-400 mt-1">點擊下方按鈕開始</span>
                </div>
            `;
        }

        function renderWheelCanvas() {
            const canvas = document.getElementById('wheel-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const eligibleList = participants.filter(p => p.isEligible);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (eligibleList.length === 0) {
                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.arc(160, 160, 150, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#94a3b8';
                ctx.font = '14px Noto Sans TC';
                ctx.textAlign = 'center';
                ctx.fillText('無合格參加者', 160, 165);
                return;
            }

            const total = eligibleList.length;
            const arc = (Math.PI * 2) / total;
            const colors = ['#eab308', '#0284c7', '#10b981', '#f43f5e', '#8b5cf6', '#f97316', '#14b8a6'];

            for (let i = 0; i < total; i++) {
                const angle = i * arc;
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.moveTo(160, 160);
                ctx.arc(160, 160, 150, angle, angle + arc);
                ctx.lineTo(160, 160);
                ctx.fill();

                // Text
                ctx.save();
                ctx.fillStyle = '#020617';
                ctx.font = 'bold 12px Noto Sans TC';
                ctx.translate(160 + Math.cos(angle + arc / 2) * 100, 160 + Math.sin(angle + arc / 2) * 100);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                const displayName = eligibleList[i].name.length > 8 ? eligibleList[i].name.substring(0, 8) + '...' : eligibleList[i].name;
                ctx.fillText(displayName, 0, 0);
                ctx.restore();
            }

            // Center Pin
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(160, 160, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#eab308';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function startDraw() {
            if (isDrawing) return;

            const allowRepeat = document.getElementById('allow-repeat-toggle').checked;
            const eligiblePool = allowRepeat ? participants : participants.filter(p => p.isEligible);
            const count = parseInt(document.getElementById('draw-count-select').value, 10);

            if (eligiblePool.length === 0) {
                showToast('已無符合資格的參加者！', 'error');
                return;
            }

            const drawAmount = Math.min(count, eligiblePool.length);
            isDrawing = true;
            document.getElementById('btn-draw-start').disabled = true;
            document.getElementById('btn-draw-start').classList.add('opacity-50', 'cursor-not-allowed');

            // Pick random winners from pool
            const selectedWinners = [];
            const poolCopy = [...eligiblePool];

            for (let i = 0; i < drawAmount; i++) {
                const randIndex = Math.floor(Math.random() * poolCopy.length);
                selectedWinners.push(poolCopy[randIndex]);
                poolCopy.splice(randIndex, 1);
            }

            if (activeDrawMode === 'slot') {
                runSlotAnimation(selectedWinners, allowRepeat);
            } else {
                runWheelAnimation(selectedWinners, allowRepeat);
            }
        }

        function runSlotAnimation(selectedWinners, allowRepeat) {
            const reel = document.getElementById('slot-reel');
            const totalDuration = 3500; // ms
            const intervalTime = 60; // ms
            let elapsed = 0;

            const pool = participants.filter(p => p.isEligible);
            if (pool.length === 0) return;

            const timer = setInterval(() => {
                elapsed += intervalTime;
                playTickSound();

                // Pick random display
                const randomItem = pool[Math.floor(Math.random() * pool.length)];
                reel.innerHTML = `
                    <div class="h-20 flex flex-col items-center justify-center text-center px-4">
                        <span class="text-3xl md:text-4xl font-black gold-gradient-text tracking-wide">${escapeHtml(randomItem.name)}</span>
                        ${randomItem.sub ? `<span class="text-xs text-amber-300/80 mt-1">${escapeHtml(randomItem.sub)}</span>` : ''}
                    </div>
                `;

                if (elapsed >= totalDuration) {
                    clearInterval(timer);
                    finalizeDraw(selectedWinners, allowRepeat);
                }
            }, intervalTime);
        }

        function runWheelAnimation(selectedWinners, allowRepeat) {
            const canvas = document.getElementById('wheel-canvas');
            let rotation = 0;
            const duration = 3500;
            const start = performance.now();

            function animateWheel(now) {
                const elapsed = now - start;
                const progress = Math.min(elapsed / duration, 1);
                // Ease out cubic
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                rotation = easeOut * 360 * 5; // 5 full spins
                canvas.style.transform = `rotate(${rotation}deg)`;

                if (Math.floor(elapsed / 100) % 2 === 0) {
                    playTickSound();
                }

                if (progress < 1) {
                    requestAnimationFrame(animateWheel);
                } else {
                    finalizeDraw(selectedWinners, allowRepeat);
                }
            }

            requestAnimationFrame(animateWheel);
        }

        function finalizeDraw(selectedWinners, allowRepeat) {
            isDrawing = false;
            document.getElementById('btn-draw-start').disabled = false;
            document.getElementById('btn-draw-start').classList.remove('opacity-50', 'cursor-not-allowed');

            const prizeTitle = document.getElementById('prize-title').value.trim() || '幸運大獎';

            // Mark winners and update records
            selectedWinners.forEach(w => {
                if (!allowRepeat) {
                    const found = participants.find(p => p.id === w.id);
                    if (found) found.isEligible = false;
                }

                winners.unshift({
                    timestamp: new Date().toLocaleTimeString(),
                    prize: prizeTitle,
                    name: w.name,
                    sub: w.sub,
                    id: w.id
                });
            });

            // Sound & Confetti
            playFanfareSound();
            fireConfetti();

            // Update UI
            updateStats();
            renderWinnersList();
            renderCandidatesList();
            renderWheelCanvas();

            // Update Slot display to primary winner
            if (selectedWinners.length > 0) {
                const primary = selectedWinners[0];
                document.getElementById('slot-reel').innerHTML = `
                    <div class="h-20 flex flex-col items-center justify-center text-center px-4 animate-bounce-short">
                        <span class="text-3xl md:text-4xl font-extrabold text-amber-300 drop-shadow-md tracking-wide">${escapeHtml(primary.name)}</span>
                        ${primary.sub ? `<span class="text-xs text-amber-100 mt-1 bg-amber-500/20 px-2 py-0.5 rounded-full">${escapeHtml(primary.sub)}</span>` : ''}
                    </div>
                `;
            }

            // Show Winner Modal Popup
            showWinnerModal(prizeTitle, selectedWinners);
        }

        function fireConfetti() {
            try {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } catch(e) {}
        }

        function showWinnerModal(prizeName, winnerList) {
            const modal = document.getElementById('winner-modal');
            const box = document.getElementById('modal-box');
            const modalPrize = document.getElementById('modal-prize-name');
            const modalCards = document.getElementById('modal-winner-cards');

            modalPrize.textContent = `🎉 ${prizeName}`;
            modalCards.innerHTML = winnerList.map(w => `
                <div class="p-3 bg-slate-900/90 rounded-2xl border border-amber-500/40 flex flex-col items-center justify-center shadow-md">
                    <span class="text-xl font-bold text-amber-300">${escapeHtml(w.name)}</span>
                    ${w.sub ? `<span class="text-xs text-slate-400 mt-0.5">${escapeHtml(w.sub)}</span>` : ''}
                </div>
            `).join('');

            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-90');
            box.classList.add('scale-100');
        }

        function closeWinnerModal() {
            const modal = document.getElementById('winner-modal');
            const box = document.getElementById('modal-box');

            box.classList.remove('scale-100');
            box.classList.add('scale-90');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function renderWinnersList() {
            const container = document.getElementById('winners-list-container');
            document.getElementById('winner-count-badge').textContent = winners.length;

            if (winners.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-slate-500 text-xs py-12">
                        <i class="fa-solid fa-gift text-3xl mb-2 opacity-30"></i>
                        <p>尚未抽出任何中獎者</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = winners.map((w, index) => `
                <div class="p-2.5 rounded-xl bg-slate-900/80 border border-slate-800 flex items-center justify-between text-xs hover:border-amber-500/40 transition">
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <span class="w-5 h-5 rounded-full bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center text-[10px] shrink-0">
                            ${winners.length - index}
                        </span>
                        <div class="truncate">
                            <div class="font-bold text-slate-100 truncate">${escapeHtml(w.name)}</div>
                            <div class="text-[10px] text-amber-400/80 truncate">${escapeHtml(w.prize)} ${w.sub ? `• ${escapeHtml(w.sub)}` : ''}</div>
                        </div>
                    </div>
                    <span class="text-[10px] text-slate-500 shrink-0 ml-2">${w.timestamp}</span>
                </div>
            `).join('');
        }

        function renderCandidatesList(filteredItems = null) {
            const container = document.getElementById('candidates-list-container');
            const items = filteredItems || participants;

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 text-xs py-8">無符合的參加者資料</div>`;
                return;
            }

            container.innerHTML = items.map(p => `
                <div class="p-2 rounded-lg bg-slate-900/50 border border-slate-800/80 flex items-center justify-between text-xs">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <span class="w-2 h-2 rounded-full ${p.isEligible ? 'bg-emerald-400' : 'bg-slate-600'}"></span>
                        <span class="font-medium ${p.isEligible ? 'text-slate-200' : 'text-slate-500 line-through'} truncate">${escapeHtml(p.name)}</span>
                        ${p.sub ? `<span class="text-[10px] text-slate-500 truncate">(${escapeHtml(p.sub)})</span>` : ''}
                    </div>
                    <button onclick="toggleCandidateEligibility(${p.id})" class="text-[10px] px-2 py-0.5 rounded border ${p.isEligible ? 'border-rose-500/40 text-rose-400 hover:bg-rose-500/10' : 'border-emerald-500/40 text-emerald-400 hover:bg-emerald-500/10'} transition">
                        ${p.isEligible ? '排除' : '恢復'}
                    </button>
                </div>
            `).join('');
        }

        function filterCandidates() {
            const query = document.getElementById('candidate-search').value.toLowerCase().trim();
            if (!query) {
                renderCandidatesList();
                return;
            }
            const filtered = participants.filter(p => 
                p.name.toLowerCase().includes(query) || (p.sub && p.sub.toLowerCase().includes(query))
            );
            renderCandidatesList(filtered);
        }

        function toggleCandidateEligibility(id) {
            const target = participants.find(p => p.id === id);
            if (target) {
                target.isEligible = !target.isEligible;
                updateStats();
                filterCandidates();
                renderWheelCanvas();
            }
        }

        function clearWinners() {
            if (winners.length === 0) return;
            winners = [];
            renderWinnersList();
            showToast('已清除中獎記錄', 'info');
        }

        function exportWinnersCsv() {
            if (winners.length === 0) {
                showToast('目前尚無中獎紀錄可匯出', 'error');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "抽籤時間,抽籤獎項,姓名,副資訊/備註\n";

            winners.forEach(w => {
                csvContent += `"${w.timestamp}","${w.prize}","${w.name}","${w.sub || ''}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `lucky_draw_winners_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('已成功下載中獎名單 CSV', 'success');
        }

        function switchDrawMode(mode) {
            activeDrawMode = mode;
            const slotBtn = document.getElementById('mode-btn-slot');
            const wheelBtn = document.getElementById('mode-btn-wheel');
            const slotView = document.getElementById('view-slot-container');
            const wheelView = document.getElementById('view-wheel-container');

            if (mode === 'slot') {
                slotBtn.className = "px-4 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold shadow transition";
                wheelBtn.className = "px-4 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition";
                slotView.classList.remove('hidden');
                wheelView.classList.add('hidden');
            } else {
                wheelBtn.className = "px-4 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold shadow transition";
                slotBtn.className = "px-4 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition";
                wheelView.classList.remove('hidden');
                wheelView.classList.add('flex');
                slotView.classList.add('hidden');
                renderWheelCanvas();
            }
        }

        function switchSideTab(tab) {
            const winnersBtn = document.getElementById('tab-btn-winners');
            const candidatesBtn = document.getElementById('tab-btn-candidates');
            const winnersContent = document.getElementById('tab-content-winners');
            const candidatesContent = document.getElementById('tab-content-candidates');

            if (tab === 'winners') {
                winnersBtn.className = "flex-1 py-2 rounded-xl text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30 transition flex items-center justify-center gap-1.5";
                candidatesBtn.className = "flex-1 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition flex items-center justify-center gap-1.5";
                winnersContent.classList.remove('hidden');
                winnersContent.classList.add('flex');
                candidatesContent.classList.add('hidden');
            } else {
                candidatesBtn.className = "flex-1 py-2 rounded-xl text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30 transition flex items-center justify-center gap-1.5";
                winnersBtn.className = "flex-1 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition flex items-center justify-center gap-1.5";
                candidatesContent.classList.remove('hidden');
                candidatesContent.classList.add('flex');
                winnersContent.classList.add('hidden');
            }
        }

        function toggleSettingsAccordion() {
            const content = document.getElementById('settings-content');
            const arrow = document.getElementById('accordion-arrow');
            content.classList.toggle('hidden');
            arrow.classList.toggle('rotate-180');
        }

        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            const icon = document.getElementById('sound-icon');
            if (isSoundEnabled) {
                icon.className = "fa-solid fa-volume-high text-lg w-5 h-5 flex items-center justify-center";
                showToast('音效已開啟', 'info');
            } else {
                icon.className = "fa-solid fa-volume-xmark text-lg text-slate-500 w-5 h-5 flex items-center justify-center";
                showToast('音效已靜音', 'info');
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClass = type === 'error' ? 'bg-rose-950/90 border-rose-500/50 text-rose-200' :
                            type === 'success' ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200' :
                            'bg-slate-900/90 border-amber-500/50 text-slate-200';

            toast.className = `px-4 py-2.5 rounded-xl border backdrop-blur-md shadow-xl text-xs font-medium transition-all duration-300 transform translate-y-2 opacity-0 flex items-center gap-2 ${bgClass}`;
            toast.innerHTML = `<span>${escapeHtml(message)}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
